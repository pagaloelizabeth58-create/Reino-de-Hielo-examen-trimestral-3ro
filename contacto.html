<header class="hero">
    <h1>Contacto</h1>
    <p>Comunícate con el Reino del Hielo</p>
</header>

<section class="contacto">

    <div class="contacto-texto">
        <h2>Únete al Reino del Hielo</h2>
        <p>
        Si deseas compartir tus ideas, enviar un mensaje o formar parte de nuestra comunidad,
        completa el formulario y nos pondremos en contacto contigo.
        </p>
    </div>

    <form class="formulario">
        <label>Nombre</label>
        <input type="text" placeholder="Escribe tu nombre" required>

        <label>Email</label>
        <input type="email" placeholder="Escribe tu correo" required>

        <label>Mensaje</label>
        <textarea placeholder="Escribe tu mensaje" rows="5" required></textarea>

        <button type="submit">Enviar mensaje</button>
    </form>

</section>

</footer>
